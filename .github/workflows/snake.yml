name: Generate Snake Animation

on:
  # 每24小时自动运行
  schedule:
    - cron: "0 0 * * *"
  # 允许手动触发
  workflow_dispatch:
  # 每次推送时运行
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=custom&color_snake=00f0ff&color_snake_dots=ff00ff&c0=1a0a2e&c1=7b2ff7&c2=f729dc&c3=00f0ff&c4=ffffff

      - name: Push snake to branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}